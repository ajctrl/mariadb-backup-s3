# Local development database. Configure an S3 bucket in template.env, then run:
# docker compose --env-file template.env up -d --build

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: development-password
      MARIADB_DATABASE: app
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30

  backup:
    build:
      context: .
      args:
        ALPINE_VERSION: '3.23'
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SCHEDULE: ${SCHEDULE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
      BACKUP_FILENAME_MODE: ${BACKUP_FILENAME_MODE:-timestamp}
      BACKUP_MODE: ${BACKUP_MODE:-per-database}
      PASSPHRASE: ${PASSPHRASE:-}
      S3_REGION: ${S3_REGION:-us-west-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX-backup}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_UPLOAD_PART_SIZE_MB: ${S3_UPLOAD_PART_SIZE_MB:-8}
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE-app}
      MARIADB_DATABASES: ${MARIADB_DATABASES:-}
      MARIADB_BACKUP_ALL: ${MARIADB_BACKUP_ALL:-false}
      MARIADB_DATABASES_EXCLUDE: ${MARIADB_DATABASES_EXCLUDE:-}
      MARIADB_DUMP_EXTRA_OPTS: ${MARIADB_DUMP_EXTRA_OPTS:-}
      MARIADB_USER: root
      MARIADB_PASSWORD: development-password
