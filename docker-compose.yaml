# Local development database. Copy template.env to .env and configure an S3 bucket, then run:
# docker compose --env-file .env up -d --build

services:
  mariadb:
    image: mariadb:11.4.14@sha256:3142de550b6cd60c30636e2b260eb2f923fe10a5675e88dc86a8ea09eacda8c5
    user: mysql
    environment:
      MARIADB_ROOT_PASSWORD: development-password
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: app
      MARIADB_USER: app_backup
      MARIADB_PASSWORD: development-backup-password
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30

  backup:
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      RESTORE_DATABASE_DEFAULTS: ${RESTORE_DATABASE_DEFAULTS:-}
      RESTORE_LOG_ERROR_DETAILS: "${RESTORE_LOG_ERROR_DETAILS:-false}"
      BACKUP_TIMEOUT: ${BACKUP_TIMEOUT:-24h}
      SCHEDULE: ${SCHEDULE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
      BACKUP_FILENAME_MODE: ${BACKUP_FILENAME_MODE:-timestamp}
      BACKUP_ALLOW_UNVERSIONED_OVERWRITE: "${BACKUP_ALLOW_UNVERSIONED_OVERWRITE-false}"
      BACKUP_MODE: ${BACKUP_MODE:-per-database}
      PASSPHRASE: ${PASSPHRASE:-}
      S3_REGION: ${S3_REGION:-us-west-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX-backup}
      S3_ALLOW_HTTP: "${S3_ALLOW_HTTP:-false}"
      S3_UPLOAD_BUFFER: ${S3_UPLOAD_BUFFER:-memory}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_UPLOAD_PART_SIZE_MB: ${S3_UPLOAD_PART_SIZE_MB:-8}
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE-app}
      MARIADB_DATABASES: ${MARIADB_DATABASES:-}
      MARIADB_BACKUP_ALL: ${MARIADB_BACKUP_ALL:-false}
      MARIADB_DATABASES_EXCLUDE: ${MARIADB_DATABASES_EXCLUDE:-}
      MARIADB_DUMP_EXTRA_OPTS: ${MARIADB_DUMP_EXTRA_OPTS:-}
      MARIADB_USER: app_backup
      MARIADB_PASSWORD: development-backup-password
