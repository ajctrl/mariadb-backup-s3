name: Verify and publish tested images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGCTL_VERSION: v0.11.7

jobs:
  unit:
    outputs:
      series: ${{ steps.matrix.outputs.series }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - id: matrix
        name: Read supported series from the pinned Dockerfile stages
        run: |
          series=$(python3 .github/scripts/mariadb_lts.py matrix)
          echo "series=$series" >> "$GITHUB_OUTPUT"
      - name: Verify LTS discovery and series additions
        run: python3 tests/ci/test_mariadb_lts.py
      - name: Verify when restore compatibility tests are required
        run: bash tests/ci/previous-image.sh
      - name: Test with race detector
        env:
          CLI_TEST_RACE: "1"
          GORACE: atexit_sleep_ms=0
        run: go test -count=1 -race ./...
      - name: Verify follow-up PR selection
        run: bash tests/ci/refresh.sh
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal tests)"

  publication-test:
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:3
        ports:
          - 5000/tcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: ${{ env.REGCTL_VERSION }}
      - name: Verify retry and out-of-order publication
        env:
          REGISTRY_PORT: ${{ job.services.registry.ports['5000'] }}
        run: bash tests/ci/publication.sh "127.0.0.1:$REGISTRY_PORT"

  integration:
    needs: unit
    name: Integration (${{ matrix.series }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.unit.outputs.series) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      MARIADB_SERIES: ${{ matrix.series }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
      - name: Build and load native image for testing
        env:
          PROVENANCE_MODE: ${{ github.event.repository.private && 'min' || 'max' }}
        run: |
          archive="$RUNNER_TEMP/image-${{ matrix.arch }}.tar"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          docker buildx build --build-arg "MARIADB_SERIES=$MARIADB_SERIES" --platform linux/${{ matrix.arch }} --provenance="mode=$PROVENANCE_MODE" \
            --tag "$image" --output "type=oci,dest=$archive" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$MARIADB_SERIES" .
          docker load --input "$archive"
          docker tag "$image" mariadb-backup-s3:integration
          expected=$(tar -xOf "$archive" index.json | jq -er '.manifests | select(length == 1) | .[0].digest')
          test "$(docker image inspect --format '{{.Descriptor.Digest}}' mariadb-backup-s3:integration)" = "$expected"
      - name: Verify the client series and pull matching test fixtures
        run: |
          server=$(awk -v stage="client-$MARIADB_SERIES" '$1=="FROM" && $4==stage {print $2}' Dockerfile)
          test -n "$server"
          patch=${server#mariadb:}
          patch=${patch%@*}
          for tool in mariadb mariadb-dump; do
            version=$(docker run --rm mariadb-backup-s3:integration "$tool" --version)
            echo "$version"
            release=$(sed -nE 's/^.* (from|Distrib) ([^ ,]+)-MariaDB,.*/\2/p' <<< "$version")
            if [[ "$release" != "$patch" ]]; then
              echo "::error::Expected $tool to report MariaDB $patch"
              exit 1
            fi
          done
          s3=$(sed -n 's/^const defaultS3TestImage = "\([^"]*\)"$/\1/p' tests/integration/docker_test.go)
          docker pull "$server"
          docker pull "$s3"
          echo "MARIADB_TEST_IMAGE=$server" >> "$GITHUB_ENV"
      - name: Prepare the base commit's backup image for restore compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/build-previous-image.sh
      - name: Verify MariaDB and S3 backup and restore
        run: go test -count=1 -tags=integration -v -timeout=20m ./tests/integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: image-${{ matrix.series }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  integration-required:
    name: All series backup and restore
    needs: integration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.integration.result }}

  publish:
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.unit.outputs.series) }}
    env:
      MARIADB_SERIES: ${{ matrix.series }}
    needs: [unit, integration, publication-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    concurrency:
      group: publish-tested-images-${{ matrix.series }}
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: ${{ env.REGCTL_VERSION }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - id: canonical
        run: bash .github/scripts/publish-image.sh lookup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.canonical.outputs.digest == ''
        with:
          pattern: image-${{ matrix.series }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/tested
      - id: prepare
        if: steps.canonical.outputs.digest == ''
        run: bash .github/scripts/publish-image.sh prepare
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.canonical.outputs.digest == ''
        with:
          subject-name: ${{ steps.prepare.outputs.name }}
          subject-digest: ${{ steps.prepare.outputs.digest }}
          push-to-registry: false
      - id: publish
        env:
          PREPARED_DIGEST: ${{ steps.prepare.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          MIRROR_USER: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME || '' }}
        run: bash .github/scripts/publish-image.sh publish

      - name: Promote the tested digest if this commit is still main
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          MIRROR_USER: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME || '' }}
        run: bash .github/scripts/publish-image.sh promote
