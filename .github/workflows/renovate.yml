name: Renovate

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  queue: max

jobs:
  update:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          renovate-image: ghcr.io/renovatebot/renovate:44@sha256:f88c659a3fbec410e4661cfc1f3a1c1a848c421c81418cd5d6f491c05cf4412e
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'

  refresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - name: Update outstanding Renovate branches and trigger PR checks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: bash .github/scripts/refresh-renovate-prs.sh

  discover-lts:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      candidates: ${{ steps.discover.outputs.candidates }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: discover
        name: Find new stable LTS series with published multi-architecture images
        run: |
          candidates=$(python3 .github/scripts/mariadb_lts.py discover)
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"

  propose-lts:
    permissions:
      contents: read
      pull-requests: read
    needs: discover-lts
    if: needs.discover-lts.outputs.candidates != '[]'
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.discover-lts.outputs.candidates) }}
    runs-on: ubuntu-24.04
    env:
      SERIES: ${{ matrix.candidate.series }}
      BRANCH: lts/mariadb-${{ matrix.candidate.series }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - id: previous
        name: Respect existing proposals, including closed ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=main -f "head=$GITHUB_REPOSITORY_OWNER:$BRANCH" -f state=all --jq length)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - if: steps.previous.outputs.count == '0'
        name: Add the pinned image and its update policy
        env:
          VERSION: ${{ matrix.candidate.version }}
          DIGEST: ${{ matrix.candidate.digest }}
        run: python3 .github/scripts/mariadb_lts.py add "$SERIES" "$VERSION" "$DIGEST"
      - if: steps.previous.outputs.count == '0'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - if: steps.previous.outputs.count == '0'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: ${{ env.BRANCH }}
          add-paths: |
            Dockerfile
            renovate.json
            README.md
          commit-message: "feat: support MariaDB ${{ env.SERIES }} LTS"
          title: "Add MariaDB ${{ env.SERIES }} LTS"
          body: |
            The MariaDB Foundation lists ${{ env.SERIES }} as a stable Community LTS.
            The official MariaDB ${{ matrix.candidate.version }} image includes Linux amd64 and arm64.
            Review both backup and restore jobs before manually merging to publish the new series.
            [Release catalog](https://downloads.mariadb.org/rest-api/mariadb/)
