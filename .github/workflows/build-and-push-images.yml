name: build and push images

on:
  push:
    branches: ['main', 'master']
  pull_request:

permissions:
  contents: read

env:
  ALPINE_VERSION: '3.23'
  MARIADB_VERSION: '11.4'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run tests with the race detector
        env:
          CLI_TEST_RACE: "1"
          GORACE: "atexit_sleep_ms=0"
        run: go test -count=1 -race ./...

      - name: Vet Go packages
        run: go vet ./...

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build the integration image
        run: docker build --build-arg ALPINE_VERSION="$ALPINE_VERSION" -t mariadb-backup-s3:integration .

      - name: Verify MariaDB and S3 backup/restore round trips
        env:
          MARIADB_TEST_IMAGE: mariadb:${{ env.MARIADB_VERSION }}
          BACKUP_TEST_IMAGE: mariadb-backup-s3:integration
        run: go test -count=1 -tags=integration -v -timeout=15m ./tests/integration

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [test, integration]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare image tags
        id: images
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ENABLED: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            printf 'ghcr.io/%s:%s\n' "$repository" "$MARIADB_VERSION"
            if [[ "$DOCKERHUB_ENABLED" == 'true' ]]; then
              printf 'docker.io/%s/%s:%s\n' "${DOCKERHUB_USERNAME,,}" "${repository##*/}" "$MARIADB_VERSION"
            fi
            echo 'EOF'
            printf 'dockerhub_enabled=%s\n' "$DOCKERHUB_ENABLED"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.images.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          platforms: |
            linux/amd64
            linux/arm64
